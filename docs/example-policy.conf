# An example transport policy.  Copy to ~/.config/transport-policy.conf and edit.
#
#   (cl-transport.gate:initialize)
#
# First match wins, top to bottom.  `*' globs.  A host pattern matches the address
# or any name that address has been resolved from.

default allow            # watch first; switch to `deny' once the log looks right

# Everything must at least be dialled, so the machine's networking goes through the
# one place that knows how to route it.  Anything that opens its own socket carries
# :RAW and is refused.  Turn this on and read the log: what it denies is the list of
# code still to be moved onto DIAL.
#
# require *        via cl-transport

# The browser may only reach the world over Tor.
# require loom/*   via tor

# Nothing in this image has any business here.
deny   *         169.254.169.254        # cloud metadata

# The browser goes to the web, but never to a mail port.
deny   loom/*    *:25
